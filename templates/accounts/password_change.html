{% extends 'base.html' %}
{% block title %}Change password | Auth Portal{% endblock %}
{% block content %}<section class="card"><h1>Change password</h1><form method="post">{% csrf_token %}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}</div>{% endfor %}<button>Update password</button></form></section>{% endblock %}
