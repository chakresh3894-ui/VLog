{% load static %}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Auth Portal{% endblock %}</title><link rel="stylesheet" href="{% static 'css/styles.css' %}?v=2"></head>
<body><header class="site-header"><a class="brand" href="{% url 'accounts:dashboard' %}"><span>✦</span> Auth Portal</a>{% if user.is_authenticated %}<nav>{% if user.is_superuser %}<a href="{% url 'accounts:admin_overview' %}">Admin overview</a>{% endif %}<a href="{% url 'accounts:password_change' %}">Change password</a><form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="nav-button" type="submit">Log out</button></form></nav>{% endif %}</header><main>{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
